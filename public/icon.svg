<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a21"/>
      <stop offset="50%" stop-color="#0e1318"/>
      <stop offset="100%" stop-color="#070a0d"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Subtle glow aura -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Dumbbell Icon Art (Centered in 512x512) -->
  <g transform="translate(256,256) rotate(-35) translate(-256,-256)">
    <!-- Central Bar -->
    <rect x="136" y="238" width="240" height="36" rx="18" fill="url(#metalGrad)" stroke="#1e293b" stroke-width="4"/>
    
    <!-- Grip knurling lines -->
    <line x1="216" y1="240" x2="216" y2="272" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="236" y1="240" x2="236" y2="272" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="256" y1="240" x2="256" y2="272" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="276" y1="240" x2="276" y2="272" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="296" y1="240" x2="296" y2="272" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Inner Collar & Plate -->
    <rect x="156" y="180" width="22" height="152" rx="10" fill="#10b981"/>
    <rect x="114" y="152" width="38" height="208" rx="16" fill="url(#emeraldGrad)" stroke="#047857" stroke-width="4"/>
    <rect x="76" y="174" width="34" height="164" rx="14" fill="url(#emeraldGrad)" opacity="0.95" stroke="#047857" stroke-width="4"/>

    <!-- Right Inner Collar & Plate -->
    <rect x="334" y="180" width="22" height="152" rx="10" fill="#10b981"/>
    <rect x="360" y="152" width="38" height="208" rx="16" fill="url(#emeraldGrad)" stroke="#047857" stroke-width="4"/>
    <rect x="402" y="174" width="34" height="164" rx="14" fill="url(#emeraldGrad)" opacity="0.95" stroke="#047857" stroke-width="4"/>
  </g>
</svg>
